<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 480px; }
    h1 { margin-bottom: 1rem; text-align: center; color: #38bdf8; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    input { padding: 0.8rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    button { padding: 0.8rem; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0284c7; color: #fff; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #0f172a; border-radius: 6px; word-break: break-all; text-align: center; display: none; }
    .result a { color: #38bdf8; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Shortener</h1>
    <form id="shortenForm">
      <input type="url" id="originalUrl" placeholder="Paste a long URL here..." required />
      <button type="submit">Shorten URL</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script>
    const form = document.getElementById("shortenForm");
    const resultDiv = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const originalUrl = document.getElementById("originalUrl").value;

      const res = await fetch("/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ originalUrl })
      });

      const data = await res.json();
      if (res.ok) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
      } else {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<span style="color: #ef4444;">Error: ${data.error}</span>`;
      }
    });
  </script>
</body>
</html>
